canisters:
  # Motoko canisters use the v5 recipe, which runs `mops build <name>`: each
  # canister's entry point and the moc flags live in mops.toml.
  - name: ai_proxy
    recipe:
      type: "@dfinity/motoko@v5.0.0"

  - name: auth
    recipe:
      type: "@dfinity/motoko@v5.0.0"

  - name: property
    recipe:
      type: "@dfinity/motoko@v5.0.0"

  - name: job
    recipe:
      type: "@dfinity/motoko@v5.0.0"

  - name: contractor
    recipe:
      type: "@dfinity/motoko@v5.0.0"

  - name: quote
    recipe:
      type: "@dfinity/motoko@v5.0.0"

  - name: payment
    recipe:
      type: "@dfinity/motoko@v5.0.0"

  - name: photo
    recipe:
      type: "@dfinity/motoko@v5.0.0"

  - name: monitoring
    recipe:
      type: "@dfinity/motoko@v5.0.0"

  - name: market
    recipe:
      type: "@dfinity/motoko@v5.0.0"

  - name: report
    recipe:
      type: "@dfinity/motoko@v5.0.0"

  - name: maintenance
    recipe:
      type: "@dfinity/motoko@v5.0.0"

  - name: sensor
    recipe:
      type: "@dfinity/motoko@v5.0.0"

  - name: listing
    recipe:
      type: "@dfinity/motoko@v5.0.0"

  - name: agent
    recipe:
      type: "@dfinity/motoko@v5.0.0"

  - name: fee
    recipe:
      type: "@dfinity/motoko@v5.0.0"

  - name: bills
    recipe:
      type: "@dfinity/motoko@v5.0.0"

  - name: recurring
    recipe:
      type: "@dfinity/motoko@v5.0.0"

  - name: audit
    recipe:
      type: "@dfinity/motoko@v5.0.0"

  - name: referrals
    recipe:
      type: "@dfinity/motoko@v5.0.0"

  # Frontend: the certified-assets canister (static-site skill). It serves
  # frontend/dist/ with the headers in dist/_headers (written by
  # frontend/scripts/gen-ic-assets.mjs) and the SPA rule in dist/_redirects
  # (from frontend/public/). The build runs from the repo root, so it names
  # the frontend workspace. Moving from the legacy @dfinity/asset-canister
  # needs one reinstall of this canister; scripts/deploy.sh does that when it
  # finds the legacy canister still installed.
  - name: frontend
    recipe:
      type: "@dfinity/static-site@v0.4.0"
      configuration:
        dir: frontend/dist
        build:
          - npm run build --workspace frontend

networks:
  - name: local
    mode: managed
    ii: true
    gateway:
      bind: 127.0.0.1
      port: 4943

  # ic is a reserved built-in network in icp-cli (https://icp-api.io) — do not redeclare it

environments:
  - name: local
    network: local

  # testnet and ic both target the IC mainnet; use the built-in ic network
  # which has the root-key pre-configured (no custom network declaration needed)
  - name: testnet
    network: ic

  - name: ic
    network: ic
