  - name: audit
    recipe:
      type: "@dfinity/motoko@v5.0.0"

  - name: referrals
    recipe:
      type: "@dfinity/motoko@v5.0.0"

  # Frontend asset canister
  #
  # This recipe's build.script runs from the repo root, not `frontend/` —
  # a `workdir: frontend` key was here before but icp-cli 1.4.0's
  # asset-canister recipe doesn't honor it (confirmed by inspecting the
  # npm debug log: cwd was the repo root, not frontend/). Since root's
  # package.json has no "build" script of its own (only frontend/'s
  # workspace does), a plain `npm run build` here always failed with
  # "Missing script: build" the moment this canister was first deployed.
  # --workspace frontend targets frontend's own build script explicitly,
  # which works regardless of which directory the recipe actually runs
  # the command from.
  - name: frontend
    recipe:
      type: "@dfinity/asset-canister@v2.2.1"
      configuration:
        dir: frontend/dist
        build:
          script: npm run build --workspace frontend

networks:
  - name: local
    mode: managed
    ii: true
    gateway:
      bind: 127.0.0.1
      port: 4943

  # ic is a reserved built-in network in icp-cli (https://icp-api.io) — do not redeclare it

environments:
  - name: local
    network: local

  # testnet and ic both target the IC mainnet; use the built-in ic network
  # which has the root-key pre-configured (no custom network declaration needed)
  - name: testnet
    network: ic

  - name: ic
    network: ic
