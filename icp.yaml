canisters:
  # Motoko canisters use the v5 recipe, which runs `mops build <name>`: each
  # canister's entry point and the moc flags live in mops.toml.
  - name: ai_proxy
    recipe:
      type: "@dfinity/motoko@v5.0.0"

  - name: auth
    recipe:
      type: "@dfinity/motoko@v5.0.0"

  - name: property
    recipe:
      type: "@dfinity/motoko@v5.0.0"

  - name: job
    recipe:
      type: "@dfinity/motoko@v5.0.0"

  - name: contractor
    recipe:
      type: "@dfinity/motoko@v5.0.0"

  - name: quote
    recipe:
      type: "@dfinity/motoko@v5.0.0"

  - name: payment
    recipe:
