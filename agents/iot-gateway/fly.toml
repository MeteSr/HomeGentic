# Fly.io app for the IoT gateway (vendor webhooks, pollers, sensor account
# sign-in). One always-on machine: the pollers must keep running and the
# vendor OAuth tokens are files on the /data volume.
#
# Deployed by .github/workflows/deploy-relays.yml, which passes --app for
# testnet (homegentic-iot-gateway-testnet). Secrets, including
# IOT_GATEWAY_PUBLIC_URL, are set with `fly secrets set` (docs/DEPLOYMENT.md).
app = "homegentic-iot-gateway"
primary_region = "iad"

[env]
  TRUST_PROXY_HOPS     = "1"   # Fly's proxy sets X-Forwarded-For (rate limits key on the client)
  NODE_ENV             = "production"
  IOT_GATEWAY_PORT     = "8080"
  ICP_HOST             = "https://icp-api.io"
  ECOBEE_TOKENS_FILE   = "/data/ecobee-tokens.json"
  HONEYWELL_TOKENS_FILE = "/data/honeywell-tokens.json"
  GE_TOKENS_FILE       = "/data/ge-tokens.json"
  TESLA_SESSION_FILE   = "/data/tesla-session.json"

[[mounts]]
  source      = "iot_gateway_data"
  destination = "/data"

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = "off"
  auto_start_machines  = false
  min_machines_running = 1

  [[http_service.checks]]
    method       = "GET"
    path         = "/health"
    interval     = "30s"
    timeout      = "5s"
    grace_period = "15s"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
