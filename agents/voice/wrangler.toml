name = "homegentic-voice-agent"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
AI_MODEL = "claude-sonnet-4-6"
NODE_ENV = "production"
DFX_NETWORK = "ic"
BIDTOLIST_RESEND_FROM = "noreply@bidtolist.com"
BIDTOLIST_ICP_HOST = "https://ic0.app"
HOMEGENTIC_ICP_HOST = "https://ic0.app"
# Domain of the invoice forwarding addresses (h-<token>@INBOX_DOMAIN). Needs an
# Email Routing catch-all to this Worker (docs/DEPLOYMENT.md). Empty → inbound
# mail is ignored.
INBOX_DOMAIN = ""

# Persisted Workers Logs (otherwise logs exist only in a live `wrangler tail`).
[observability]
enabled = true

# KV namespace for rate limiting (global 30 req/min + agent daily quotas).
# No `id`: wrangler creates the namespace on the first deploy and reuses it
# after (the placeholder ID that was here made every production deploy fail).
# To pin an existing namespace instead, add its id from
# `npx wrangler kv namespace list`.
[[kv_namespaces]]
binding     = "RATE_LIMIT"

# Durable Object for atomic rate-limit counters and email dedupe (F-10):
# one RateLimiterDO instance per limiter key (src/rateLimiterDO.ts). KV above
# stays bound for the Stripe-webhook dedupe and as the limiter's fallback.
[[durable_objects.bindings]]
name       = "RATE_LIMITER"
class_name = "RateLimiterDO"

[[migrations]]
tag               = "v1-rate-limiter-do"
new_sqlite_classes = ["RateLimiterDO"]

# R2 bucket for off-chain photo bytes (/photos/*, src/photos.ts). Left
# commented until the bucket exists, because a deploy that binds a missing
# bucket fails; until then /photos/* answers 503 and the app keeps photos
# on-chain. To enable: `npx wrangler r2 bucket create homegentic-photos`,
# then uncomment.
# [[r2_buckets]]
# binding     = "PHOTOS"
# bucket_name = "homegentic-photos"

[triggers]
crons = ["0 * * * *"]   # every hour — scheduledBidtolist (deadline reminders) and the referral-fee charge run

# ── Secrets — never stored here, set via `wrangler secret put <NAME>` ────────
#
# Required:
#   ANTHROPIC_API_KEY
#   VOICE_AGENT_API_KEY           public client id (ships in the frontend bundle; not auth).
#                                 Every /api/* route returns 500 without it in production.
#   FRONTEND_ORIGIN               e.g. https://homegentic.com
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
#   DFX_IDENTITY_PEM              Ed25519 PEM for ICP canister admin calls
#   CANISTER_ID_PAYMENT
#   CANISTER_ID_AUTH              resolves x-agent-session tokens (401 without it)
#   CANISTER_ID_JOB               contractor-invite email (/api/email/contractor-invite)
#   CANISTER_ID_PHOTO             photo access checks for /photos/* (deploy.sh registers the
#                                 DFX_IDENTITY_PEM principal with photo.addPhotoRelay)
#   CANISTER_ID_CONTRACTOR        records Florida DBPR licence lookups (/api/license/check;
#                                 deploy.sh registers the principal with contractor.addLicenseRelay)
#   CANISTER_ID_FEE               Contractor Free referral fees: card setup, the hourly charge run
#                                 (deploy.sh registers the principal with fee.addReferralRelay)
#   CANISTER_ID_LISTING           files FSBO showing requests (/api/fsbo/showing-request;
#                                 deploy.sh registers the principal with listing.addShowingRelay)
#   RESEND_API_KEY                transactional email (moved off ai_proxy)
#   RESEND_FROM                   sender on a Resend-verified domain
#   ATTOM_API_KEY                 property-record lookups (/api/property/details)
#   OPENPERMIT_API_KEY            permit imports (/api/permits/import)
#   LOCAL_BROKER_EMAIL            recipient of /api/email/broker-lead
#
# Stripe price IDs (Pro is annual-only; PRO_MONTHLY is accepted but unused):
#   STRIPE_PRICE_PRO_YEARLY
#   STRIPE_PRICE_CONTRACTOR_PRO_MONTHLY
#   STRIPE_PRICE_CONTRACTOR_PRO_YEARLY
#   STRIPE_PRICE_CREDITS_25
#   STRIPE_PRICE_CREDITS_100
#
# Optional:
#   ADMIN_API_KEY                 real secret for GET /admin/cycle-status (header x-admin-key);
#                                 the route is disabled (404) when unset
#   RENTCAST_API_KEY              Add Property prefill (/api/rentcast/properties)
#   CANISTER_ID_MONITORING
#   BIDTOLIST_FRONTEND_ORIGIN     e.g. https://bidtolist.com
#   BIDTOLIST_RESEND_API_KEY
#   BIDTOLIST_STRIPE_SECRET_KEY
#   BIDTOLIST_STRIPE_WEBHOOK_SECRET
#   BIDTOLIST_STRIPE_PRICE_PLATFORM_FEE
#   BIDTOLIST_LISTING_CANISTER_ID
#   BIDTOLIST_AGENT_CANISTER_ID
#   BIDTOLIST_FEE_CANISTER_ID
#   BIDTOLIST_IDENTITY_SEED
#   HOMEGENTIC_CANISTER_ID

# ── Testnet ──────────────────────────────────────────────────────────────────
# Separate Worker for the testnet frontend, so testnet never touches production
# Stripe keys, canisters or rate-limit counters. Deployed by deploy-testnet.yml
# with `wrangler deploy --env testnet`. `vars` and `kv_namespaces` are not
# inherited from the top level, so they are repeated here. The KV binding has no
# `id`: wrangler creates the namespace on the first deploy and reuses it after.
#
# Secrets — set once with `npx wrangler secret put <NAME> --env testnet`, using
# testnet values (Stripe test keys, testnet canister IDs, the testnet frontend
# origin as FRONTEND_ORIGIN). Same names as the list above.
[env.testnet]
name = "homegentic-voice-agent-testnet"

[env.testnet.vars]
AI_MODEL = "claude-sonnet-4-6"
NODE_ENV = "production"
DFX_NETWORK = "ic"   # testnet canisters live on the IC network (icp.yaml)
BIDTOLIST_RESEND_FROM = "noreply@bidtolist.com"
BIDTOLIST_ICP_HOST = "https://ic0.app"
HOMEGENTIC_ICP_HOST = "https://ic0.app"

[[env.testnet.kv_namespaces]]
binding = "RATE_LIMIT"

# Durable Objects are not inherited by environments either.
[[env.testnet.durable_objects.bindings]]
name       = "RATE_LIMITER"
class_name = "RateLimiterDO"

[[env.testnet.migrations]]
tag               = "v1-rate-limiter-do"
new_sqlite_classes = ["RateLimiterDO"]

# R2 isn't inherited either. `npx wrangler r2 bucket create homegentic-photos-testnet`
# first, then uncomment.
# [[env.testnet.r2_buckets]]
# binding     = "PHOTOS"
# bucket_name = "homegentic-photos-testnet"
