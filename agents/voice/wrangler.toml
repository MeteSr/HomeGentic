name = "homegentic-voice-agent"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
AI_MODEL = "claude-sonnet-4-6"
NODE_ENV = "production"
DFX_NETWORK = "ic"
BIDTOLIST_RESEND_FROM = "noreply@bidtolist.com"
BIDTOLIST_ICP_HOST = "https://ic0.app"
HOMEGENTIC_ICP_HOST = "https://ic0.app"

# KV namespace for rate limiting (global 30 req/min + agent daily quotas).
# Create with: wrangler kv:namespace create RATE_LIMIT
# then replace the placeholder IDs below.
[[kv_namespaces]]
binding     = "RATE_LIMIT"
id          = "PLACEHOLDER_KV_NAMESPACE_ID"
preview_id  = "PLACEHOLDER_KV_PREVIEW_NAMESPACE_ID"

[triggers]
crons = ["0 * * * *"]   # every hour — fires scheduledBidtolist (deadline reminders)

# ── Secrets — never stored here, set via `wrangler secret put <NAME>` ────────
#
# Required:
#   ANTHROPIC_API_KEY
#   VOICE_AGENT_API_KEY
#   FRONTEND_ORIGIN               e.g. https://homegentic.com
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
#   DFX_IDENTITY_PEM              Ed25519 PEM for ICP canister admin calls
#   CANISTER_ID_PAYMENT
#   CANISTER_ID_AUTH              resolves x-agent-session tokens (401 without it)
#
# Stripe price IDs (Pro is annual-only; PRO_MONTHLY is accepted but unused):
#   STRIPE_PRICE_PRO_YEARLY
#   STRIPE_PRICE_CONTRACTOR_PRO_MONTHLY
#   STRIPE_PRICE_CONTRACTOR_PRO_YEARLY
#   STRIPE_PRICE_CREDITS_25
#   STRIPE_PRICE_CREDITS_100
#
# Optional:
#   RENTCAST_API_KEY              Add Property prefill (/api/rentcast/properties)
#   CANISTER_ID_MONITORING
#   BIDTOLIST_FRONTEND_ORIGIN     e.g. https://bidtolist.com
#   BIDTOLIST_RESEND_API_KEY
#   BIDTOLIST_STRIPE_SECRET_KEY
#   BIDTOLIST_STRIPE_WEBHOOK_SECRET
#   BIDTOLIST_STRIPE_PRICE_PLATFORM_FEE
#   BIDTOLIST_LISTING_CANISTER_ID
#   BIDTOLIST_AGENT_CANISTER_ID
#   BIDTOLIST_FEE_CANISTER_ID
#   BIDTOLIST_IDENTITY_SEED
#   HOMEGENTIC_CANISTER_ID

# ── Testnet ──────────────────────────────────────────────────────────────────
# Separate Worker for the testnet frontend, so testnet never touches production
# Stripe keys, canisters or rate-limit counters. Deployed by deploy-testnet.yml
# with `wrangler deploy --env testnet`. `vars` and `kv_namespaces` are not
# inherited from the top level, so they are repeated here. The KV binding has no
# `id`: wrangler creates the namespace on the first deploy and reuses it after.
#
# Secrets — set once with `npx wrangler secret put <NAME> --env testnet`, using
# testnet values (Stripe test keys, testnet canister IDs, the testnet frontend
# origin as FRONTEND_ORIGIN). Same names as the list above.
[env.testnet]
name = "homegentic-voice-agent-testnet"

[env.testnet.vars]
AI_MODEL = "claude-sonnet-4-6"
NODE_ENV = "production"
DFX_NETWORK = "ic"   # testnet canisters live on the IC network (icp.yaml)
BIDTOLIST_RESEND_FROM = "noreply@bidtolist.com"
BIDTOLIST_ICP_HOST = "https://ic0.app"
HOMEGENTIC_ICP_HOST = "https://ic0.app"

[[env.testnet.kv_namespaces]]
binding = "RATE_LIMIT"
