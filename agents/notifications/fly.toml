# Fly.io app for the notification relay (push, Home Pulse email, SMS, report
# alerts). One always-on machine: the pollers must keep running, and the
# relay's state is a single JSON file on the /data volume, so it must never
# scale past one machine.
#
# Deployed by .github/workflows/deploy-relays.yml, which passes --app for
# testnet (homegentic-notifications-testnet). Secrets are set with
# `fly secrets set` (see docs/DEPLOYMENT.md), never here.
app = "homegentic-notifications"
primary_region = "iad"

[env]
  NODE_ENV                = "production"
  NOTIFICATIONS_PORT      = "8080"
  NOTIFICATIONS_DATA_FILE = "/data/notifications.json"

[[mounts]]
  source      = "notifications_data"
  destination = "/data"

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = "off"
  auto_start_machines  = false
  min_machines_running = 1

  [[http_service.checks]]
    method       = "GET"
    path         = "/health"
    interval     = "30s"
    timeout      = "5s"
    grace_period = "15s"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
