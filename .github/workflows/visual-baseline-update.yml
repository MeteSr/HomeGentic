name: Update visual regression baselines

# Manual-only (#432 acceptance criteria: "explicit manual step"). Regenerates
# tests/e2e/__snapshots__/ using CI's own browser build — the same one
# test-visual compares against, so results are trustworthy — and uploads the
# refreshed PNGs as a build artifact. It never commits or pushes on its own:
# a human downloads the artifact, reviews the diffs, and commits the updated
# baselines themselves. See TESTING.md → "Visual regression tests".
on:
  workflow_dispatch: {}

jobs:
  update-baselines:
    name: update-visual-baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm install

      - name: Install Playwright browsers
        run: cd frontend && npx @playwright/test install --with-deps chromium

      - name: Regenerate baselines
        run: npm run test:visual:update

      - name: Upload updated baselines
        uses: actions/upload-artifact@v7
        with:
          name: visual-snapshots-updated
          path: tests/e2e/__snapshots__/
          retention-days: 14
