name: Performance Regression Gate

# 13.6.4 — Deploys a real local dfx replica twice (once for the PR's base
# commit, once for its head) and compares actual measured cycles cost
# between the two.
#
# This used to run both "PR" and "baseline" numbers through the same
# dry-run math with hardcoded per-target byte/instruction constants, so a
# PR's numbers and the baseline were always computed identically regardless
# of what the diff actually changed — the gate could never fail on a real
# regression. It now deploys+wires the full canister set on a local replica
# for each side and measures the real thing: dfx canister status cycle
# balance deltas around each update call, and real response payload size
# for each query call. See scripts/benchmark-updates.mjs and
# scripts/benchmark-queries.mjs for the accounting details.
#
# There's no committed baseline file to go stale — both sides of the
# comparison are produced fresh by this same workflow run.

on:
  pull_request:
    branches: [main]
    paths:
      # Only run when canister code, services, or benchmark/deploy scripts change
      - "backend/**"
      - "frontend/src/services/**"
      - "scripts/benchmark-*.mjs"
      - "scripts/ci/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  perf-live:
    name: Live cycles benchmark (${{ matrix.leg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg: [base, head]
    steps:
      # Always check out the PR head so both legs use the exact same deploy/seed/
      # benchmark tooling (scripts/ci/**, scripts/benchmark-*.mjs) — that tooling
      # is itself part of this PR's diff and doesn't exist on an older base commit.
      # Comparing tooling versions instead of canister code would invalidate the
      # measurement anyway; only backend/** (what's actually under test) should
      # differ between legs.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Swap in base-commit canister source for the base leg
        if: matrix.leg == 'base'
        run: |
          git checkout "${{ github.event.pull_request.base.sha }}" -- backend/ dfx.json mops.toml did/

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dfx
        run: |
          curl -fsSL "https://github.com/dfinity/sdk/releases/download/0.24.3/dfx-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz
          DFX_BIN=$(find . -name "dfx*" -type f -perm /111 | head -1)
          sudo install -m 755 "$DFX_BIN" /usr/local/bin/dfx
          dfx --version

      - name: Cache mops packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/mops
          key: mops-${{ runner.os }}-${{ hashFiles('mops.toml') }}

      - name: Install mops and Motoko dependencies
        run: |
          npm install -g ic-mops
          mops install
          mops toolchain use moc 1.3.0
          MOC_BIN=$(mops toolchain bin moc 2>/dev/null) || MOC_BIN=""
          if [ -z "$MOC_BIN" ]; then
            rm -rf .mops/_tmp && mops toolchain use moc 1.3.0
            MOC_BIN=$(mops toolchain bin moc)
          fi
          "$MOC_BIN" --version
          echo "DFX_MOC_PATH=$MOC_BIN" >> "$GITHUB_ENV"

      - name: Start local replica
        run: dfx start --clean --background

      - name: Deploy canisters
        run: bash scripts/ci/deploy-canisters.sh

      - name: Seed benchmark data
        run: bash scripts/ci/seed-perf-data.sh 2>&1 | tee /tmp/seed-output.log

      - name: Post seed script output on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            let log = "(no output captured)";
            try {
              log = fs.readFileSync("/tmp/seed-output.log", "utf-8");
            } catch {}
            // Comments have a size limit — keep the tail, which is where the
            // actual failure is.
            const MAX = 60000;
            if (log.length > MAX) log = "...(truncated)...\n" + log.slice(-MAX);
            const body = [
              `### ❌ scripts/ci/seed-perf-data.sh failed (leg: \`${{ matrix.leg }}\`)`,
              "",
              "<details><summary>Full output</summary>",
              "",
              "```",
              log,
              "```",
              "</details>",
            ].join("\n");
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Run query baseline (live)
        run: node scripts/benchmark-queries.mjs --live --csv > /tmp/queries.csv 2> /tmp/queries-stderr.log

      - name: Run update baseline (live)
        run: node scripts/benchmark-updates.mjs --live --csv > /tmp/updates.csv 2> /tmp/updates-stderr.log

      - name: Post benchmark stderr on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const MAX = 30000;
            function readTail(path) {
              try {
                let s = fs.readFileSync(path, "utf-8");
                if (s.length > MAX) s = "...(truncated)...\n" + s.slice(-MAX);
                return s || "(empty)";
              } catch {
                return "(not written — step may not have run)";
              }
            }
            const body = [
              `### ❌ Live benchmark failed (leg: \`${{ matrix.leg }}\`)`,
              "",
              "<details><summary>benchmark-queries.mjs stderr</summary>\n\n```\n" + readTail("/tmp/queries-stderr.log") + "\n```\n</details>",
              "",
              "<details><summary>benchmark-updates.mjs stderr</summary>\n\n```\n" + readTail("/tmp/updates-stderr.log") + "\n```\n</details>",
            ].join("\n");
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Upload leg results
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ matrix.leg }}
          path: |
            /tmp/queries.csv
            /tmp/updates.csv
          retention-days: 7

  compare:
    name: Cycles Regression Check
    needs: [perf-live]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: perf-base
          path: base

      - uses: actions/download-artifact@v8
        with:
          name: perf-head
          path: head

      - name: Compare base vs head
        id: compare
        run: |
          node - <<'EOF'
          const fs = require("fs");

          const REGRESSION_THRESHOLD = 0.25;   // 25% worse = fail
          const CYCLES_COL = 5;                 // 0-indexed column in CSV

          function parseCSV(file) {
            if (!fs.existsSync(file)) return [];
            return fs.readFileSync(file, "utf-8")
              .trim().split("\n")
              .slice(1)  // skip header
              .map((line) => {
                const cols = line.split(",");
                return { key: `${cols[0]}.${cols[1]}`, cycles: parseInt(cols[CYCLES_COL], 10) };
              })
              .filter((r) => !isNaN(r.cycles));
          }

          const baseRows = [...parseCSV("base/queries.csv"), ...parseCSV("base/updates.csv")];
          const headRows = [...parseCSV("head/queries.csv"), ...parseCSV("head/updates.csv")];

          const base = Object.fromEntries(baseRows.map((r) => [r.key, r.cycles]));
          const head = Object.fromEntries(headRows.map((r) => [r.key, r.cycles]));

          let failed = false;
          const rows = [];

          for (const [key, headCycles] of Object.entries(head)) {
            const baseCycles = base[key];
            if (baseCycles === undefined) {
              rows.push(`  NEW   ${key}: ${(headCycles/1e6).toFixed(1)}M cycles (no base measurement)`);
              continue;
            }
            if (baseCycles === 0) {
              rows.push(`  ?     ${key}: base measured 0 cycles — skipping ratio (likely a failed base call)`);
              continue;
            }
            const ratio = headCycles / baseCycles;
            const pct   = ((ratio - 1) * 100).toFixed(1);
            const flag  = ratio > (1 + REGRESSION_THRESHOLD) ? "⚠ REGRESS" : ratio < 0.9 ? "✓ IMPROVE" : "  OK     ";
            rows.push(`  ${flag}  ${key}: ${(headCycles/1e6).toFixed(1)}M (${pct > 0 ? "+" : ""}${pct}%)  base=${(baseCycles/1e6).toFixed(1)}M`);
            if (ratio > (1 + REGRESSION_THRESHOLD)) failed = true;
          }

          const summary = rows.join("\n");
          console.log("\n═══════════════════════════════════════════════════");
          console.log("  Cycles Regression Report (13.6.4) — live measurement");
          console.log("═══════════════════════════════════════════════════");
          console.log(summary);
          console.log();

          const md = [
            "## Cycles Regression Report",
            "",
            `Threshold: **±${(REGRESSION_THRESHOLD * 100).toFixed(0)}%**  |  ${failed ? "❌ REGRESSION DETECTED" : "✅ All within threshold"}`,
            "",
            "```",
            summary,
            "```",
          ].join("\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY || "/dev/null", md + "\n");

          if (failed) {
            console.error("❌ Cycles regression exceeds 25% threshold on one or more operations.");
            process.exit(1);
          } else {
            console.log("✅ All operations within acceptable regression bounds.");
          }
          EOF

      - name: Comment PR with regression report
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const body = [
              "### 📊 Cycles Regression Report (13.6.4)",
              "",
              "Both sides of this comparison were measured **live** against a real local dfx replica —",
              "the PR's base commit and its head commit, deployed and benchmarked independently in this run.",
              "Update-call cycles are real `dfx canister status` balance deltas; query-call cycles are",
              "estimated from live-measured response size (query execution itself isn't cycle-metered on IC).",
              "",
              `**Result:** ${ "${{ steps.compare.outcome }}" === "success" ? "✅ No regressions" : "❌ Regression detected — see job log" }`,
            ].join("\n");

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
