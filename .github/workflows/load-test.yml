name: Load Tests

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  load-test:
    name: k6 load tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            agents/voice/package-lock.json
            agents/iot-gateway/package-lock.json

      - name: Install k6
        run: |
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | \
            sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Install voice agent dependencies
        run: cd agents/voice && npm ci

      - name: Install IoT gateway dependencies
        run: cd agents/iot-gateway && npm ci

      # The Worker talks to a mock Anthropic API, so the load test spends no tokens.
      - name: Start mock Anthropic API
        run: |
          node tests/k6/mock-anthropic.mjs 8788 &
          npx --yes wait-on@latest http://localhost:8788/health --timeout 30000

      # NODE_ENV=development with no auth canister: the Worker takes the caller
      # from x-icp-principal (see tests/k6/lib/voice.js). /health answers 503
      # without production secrets, so wait on the port instead.
      - name: Start voice agent
        run: |
          cd agents/voice && npx wrangler dev src/index.ts --port 8787 \
            --var NODE_ENV:development --var ANTHROPIC_API_KEY:mock \
            --var ANTHROPIC_BASE_URL:http://localhost:8788 &
          npx --yes wait-on@latest tcp:localhost:8787 --timeout 60000

      - name: Start IoT gateway
        env:
          SENSOR_CANISTER_ID: dummy
          IOT_GATEWAY_PORT: "3002"
          # Skip the canister call; see tests/k6/iot-gateway-load.js.
          IOT_GATEWAY_DRY_RUN: "1"
          # Test-only secrets; k6 signs with the same defaults.
          NEST_WEBHOOK_SECRET: k6-nest
          ECOBEE_WEBHOOK_SECRET: k6-ecobee
          MOEN_FLO_WEBHOOK_SECRET: k6-moen
        run: |
          cd agents/iot-gateway && npm run dev &
          npx --yes wait-on@latest http://localhost:3002/health --timeout 30000

      # Scenario 1: voice chat throughput (~2 min in CI)
      - name: Run voice chat load test
        env:
          VOICE_AGENT_URL: http://localhost:8787
        run: k6 run --out json=results-voice.json tests/k6/voice-chat.js

      # Scenario 2: IoT gateway webhook burst + polling steady + spike (~7 min in CI)
      - name: Run IoT gateway load test
        env:
          IOT_GATEWAY_URL: http://localhost:3002
        run: k6 run --out json=results-iot.json tests/k6/iot-gateway-load.js

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ github.run_id }}
          path: results-*.json
          retention-days: 30
