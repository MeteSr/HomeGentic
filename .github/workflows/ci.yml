name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Deploy Mainnet runs this whole workflow as its pre-deploy test gate
  # (`uses: ./.github/workflows/ci.yml`, `secrets: inherit`). In a called
  # workflow github.event_name is the caller's ('workflow_dispatch'), so the
  # PR-only coverage comment and test-visual-heal (push / same-repo PR only)
  # are skipped there.
  workflow_call:

permissions:
  contents: read

jobs:
  motoko-check:
    name: motoko-compile-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 22 for check-declarations.sh (Node type stripping)
          node-version: '22'

      - name: Install icp-cli
        run: npm install -g @icp-sdk/icp-cli@1.7.0

      - name: Cache mops packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/mops
          key: mops-${{ runner.os }}-${{ hashFiles('mops.toml') }}

      - name: Install mops
        run: npm install -g ic-mops@3.5.1

      - name: Install Motoko dependencies
        run: mops install

      - name: Initialize mops toolchain (downloads moc)
        run: mops toolchain use moc 1.16.1

      - name: Pre-warm moc binary
        run: |
          MOC_BIN=$(mops toolchain bin moc 2>/dev/null) || MOC_BIN=""
          if [ -z "$MOC_BIN" ]; then
            rm -rf .mops/_tmp && mops toolchain use moc 1.16.1
            MOC_BIN=$(mops toolchain bin moc)
          fi
          echo "moc: $MOC_BIN"
          "$MOC_BIN" --version

      - name: Motoko unit tests
        run: bash scripts/ci/test-motoko-units.sh

      - name: Shared declarations match the canisters
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/candid" @icp-sdk/core@5
          CANDID_FROM="$RUNNER_TEMP/candid" bash scripts/ci/check-declarations.sh

      - name: Cross-canister calls match the callees
        run: CANDID_FROM="$RUNNER_TEMP/candid" bash scripts/ci/check-canister-calls.sh

      - name: No new Motoko compiler warnings
        run: bash scripts/ci/check-motoko-warnings.sh

      - name: Install ic-wasm
        run: |
          TMP=$(mktemp -d)
          curl -sSfL --retry 3 --retry-delay 5 \
            https://github.com/dfinity/ic-wasm/releases/download/0.9.11/ic-wasm-x86_64-unknown-linux-musl.tar.xz \
            -o "$TMP/ic-wasm.tar.xz"
          tar -xJf "$TMP/ic-wasm.tar.xz" -C "$TMP"
          BIN=$(find "$TMP" -name "ic-wasm" -type f | head -1)
          sudo install -m 755 "$BIN" /usr/local/bin/ic-wasm
          rm -rf "$TMP"
          ic-wasm --version

      - name: Start local network (needed for canister ID allocation)
        run: icp network start -d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile all Motoko canisters
        # Build every canister except the frontend asset canister.
        # Parse only the canisters: block — networks:/environments: also have
        # "  - name:" entries (e.g. "local", "testnet") which are not canisters.
        run: |
          awk '/^canisters:/{p=1;next} /^[a-z]/{p=0} p && /^  - name:/{print $3}' icp.yaml \
            | grep -v "^frontend$" | grep -v "^internet_identity$" \
            | while read -r canister; do
              echo "=== $canister ==="
              icp build "$canister" || exit 1
            done

  test-upgrade:
    # PocketIC upgrade tests (tests/upgrade/): state survives upgrading each
    # canister to itself, and upgrading from the base branch's build to this one.
    name: test-upgrade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch base commit
        id: base
        env:
          # PR: upgrade from the target branch. Push: from the previous head.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
            echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "No base commit — the upgrade-from-base suite will skip."
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache mops packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/mops
          key: mops-${{ runner.os }}-${{ hashFiles('mops.toml') }}

      - name: Install mops and moc
        run: |
          npm install -g ic-mops@3.5.1
          mops install
          mops toolchain use moc 1.16.1
          "$(mops toolchain bin moc)" --version

      - name: Build canister Wasm (this branch and base)
        # Every canister: the authz sweep and the all-canisters upgrade test cover all 20.
        run: bash scripts/ci/build-upgrade-wasms.sh "${{ steps.base.outputs.sha }}"

      - name: Install test dependencies (downloads the PocketIC server)
        run: cd tests/upgrade && npm ci

      - name: Install the dependencies of the clients that run against PocketIC (frontend, mobile via the frontend's, voice Worker, relay, IoT gateway, dashboard)
        run: |
          npm ci
          (cd agents/voice && npm ci)
          (cd agents/notifications && npm ci)
          npm ci --prefix scripts/ops
          (cd agents/iot-gateway && npm ci)
          (cd dashboard && npm ci)

      - name: Install Chromium for the browser test against real canisters (browser-flow.live.test.ts)
        # After the root npm ci, so the browser matches the pinned Playwright.
        run: npx playwright install --with-deps chromium

      - name: Run upgrade tests
        run: cd tests/upgrade && npm test

  test-backend:
    runs-on: ubuntu-latest
    needs: [motoko-check]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install dfx
        # test-backend uses dfx for local deployment: dfx handles cycle fabrication
        # automatically on local replicas. icp-cli's managed PocketIC network has no
        # cycles infrastructure so icp canister create fails on fresh networks.
        # test-backend.sh also calls `dfx ping`, so dfx must be the active replica.
        run: |
          curl -fsSL -o /tmp/dfx.tar.gz "https://github.com/dfinity/sdk/releases/download/0.24.3/dfx-x86_64-unknown-linux-gnu.tar.gz"
          echo "d8701438d05d9da0da0c90ab9342ac9ba6b0371ae9f5d1a943e94600fd674498  /tmp/dfx.tar.gz" | sha256sum -c -
          tar -xzf /tmp/dfx.tar.gz
          DFX_BIN=$(find . -name "dfx*" -type f -perm /111 | head -1)
          sudo install -m 755 "$DFX_BIN" /usr/local/bin/dfx
          dfx --version

      - name: Cache mops packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/mops
          key: mops-${{ runner.os }}-${{ hashFiles('mops.toml') }}

      - name: Install mops
        run: npm install -g ic-mops@3.5.1

      - name: Install Motoko dependencies
        run: mops install

      - name: Initialize mops toolchain (downloads moc 1.16.1)
        # Export DFX_MOC_PATH so dfx uses the mops-managed moc instead of its
        # bundled one — dfx 0.24.x bundles an older moc that lacks persistent actor.
        run: |
          mops toolchain use moc 1.16.1
          MOC_BIN=$(mops toolchain bin moc 2>/dev/null) || MOC_BIN=""
          if [ -z "$MOC_BIN" ]; then
            rm -rf .mops/_tmp && mops toolchain use moc 1.16.1
            MOC_BIN=$(mops toolchain bin moc)
          fi
          "$MOC_BIN" --version
          echo "DFX_MOC_PATH=$MOC_BIN" >> "$GITHUB_ENV"

      - name: Start local replica
        run: dfx start --clean --background

      - name: Deploy canisters
        run: bash scripts/ci/deploy-canisters.sh

      - name: Run backend tests
        run: bash scripts/test-backend.sh

  test-integration:
    runs-on: ubuntu-latest
    needs: [motoko-check]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root and frontend dependencies
        run: npm ci

      - name: Install dfx
        run: |
          curl -fsSL -o /tmp/dfx.tar.gz "https://github.com/dfinity/sdk/releases/download/0.24.3/dfx-x86_64-unknown-linux-gnu.tar.gz"
          echo "d8701438d05d9da0da0c90ab9342ac9ba6b0371ae9f5d1a943e94600fd674498  /tmp/dfx.tar.gz" | sha256sum -c -
          tar -xzf /tmp/dfx.tar.gz
          DFX_BIN=$(find . -name "dfx*" -type f -perm /111 | head -1)
          sudo install -m 755 "$DFX_BIN" /usr/local/bin/dfx
          dfx --version

      - name: Cache mops packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/mops
          key: mops-${{ runner.os }}-${{ hashFiles('mops.toml') }}

      - name: Install mops and Motoko dependencies
        run: |
          npm install -g ic-mops@3.5.1
          mops install
          mops toolchain use moc 1.16.1
          MOC_BIN=$(mops toolchain bin moc)
          echo "DFX_MOC_PATH=$MOC_BIN" >> "$GITHUB_ENV"

      - name: Start local replica
        run: dfx start --clean --background

      - name: Deploy canisters and wire inter-canister IDs
        run: bash scripts/ci/deploy-canisters.sh

      - name: Grant integration-test identity extra access
        run: |
          # Grant the integration test identity ContractorPro. Principal: fixed seed[0]=42 in setup.ts.
          INTEG_PRINCIPAL="qxmov-duod5-ahrw6-wydp4-lppe4-ljtvj-7zvu3-qke5i-umwsv-vcb7g-mqe"
          # ContractorPro → limit=0 (unlimited) in property canister, unlimited open quotes.
          # Pro caps at 20 properties and integration tests register more than 20 across all suites.
          dfx canister call payment grantSubscription "(principal \"$INTEG_PRINCIPAL\", variant { ContractorPro })"

          # TEST_ADMIN (seed[0]=160, ADMIN_SEED in integration/helpers.ts): admin on
          # property and contractor, for the steps a real admin performs in the suites
          # (verifying a property before generateReport, verifying a contractor profile).
          # The integration identity itself stays a plain user on report, so report tests
          # go through the real ownership and verification checks on a registered property.
          # Bootstrap already done above; the nonce param is required by Candid but ignored.
          TEST_ADMIN="keu4p-zyiaa-twkb3-mrrjg-6gesj-ytfss-zymq6-nzdz4-g3yvp-vejcp-nqe"
          dfx canister call property   addAdmin "(principal \"$TEST_ADMIN\", \"\")"
          dfx canister call contractor addAdmin "(principal \"$TEST_ADMIN\", \"\")"

          # Grant integration test identity admin on agent so listing.integration.test.ts
          # can self-verify a test agent profile (submitProposal requires isVerified=true —
          # invariant 05, licence re-check gate) without a real DBPR check in CI.
          dfx canister call agent addAdmin "(principal \"$INTEG_PRINCIPAL\")"

          # Let the integration test identity read the push-notification
          # outboxes (notifications.integration.test.ts), as the relay would.
          dfx canister call job   addNotifier "(principal \"$INTEG_PRINCIPAL\")"
          dfx canister call quote addNotifier "(principal \"$INTEG_PRINCIPAL\")"
          dfx canister call auth  addNotifier "(principal \"$INTEG_PRINCIPAL\")"

          # Let the integration test identity save referral-fee cards for the
          # contractors it registers, as the voice Worker does after Stripe
          # Checkout (contractors without ContractorPro need one to bid).
          dfx canister call fee addReferralRelay "(principal \"$INTEG_PRINCIPAL\")"

      - name: Run integration tests
        run: npm run test:integration

      - name: Upload integration test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: frontend/test-results/
          retention-days: 7

  test-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # allows posting the coverage comment on PRs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Type check
        run: cd frontend && npx tsc --noEmit

      - name: Unit tests with coverage
        run: cd frontend && npm run test:unit:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: frontend/coverage/
          retention-days: 14

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2
        with:
          json-summary-path: frontend/coverage/coverage-summary.json
          vite-config-path:  frontend/vite.config.ts

      - name: Build
        run: cd frontend && npm run build

      - name: SSG pre-render
        run: cd frontend && node scripts/prerender.mjs

  test-perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      # The bundle-size budgets read frontend/dist and skip themselves without it.
      - name: Build
        run: cd frontend && npm run build

      - name: Performance tests
        run: cd frontend && npm run test:perf

  test-notifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: agents/notifications/package-lock.json

      - name: Install dependencies
        run: cd agents/notifications && npm ci

      - name: Typecheck
        run: cd agents/notifications && npx tsc --noEmit -p .

      - name: Unit tests
        run: cd agents/notifications && npm test

  test-iot-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: agents/iot-gateway/package-lock.json

      - name: Install dependencies
        run: cd agents/iot-gateway && npm ci

      - name: Typecheck
        run: cd agents/iot-gateway && npx tsc --noEmit -p .

      - name: Unit tests
        run: cd agents/iot-gateway && npm test

  lint:
    # oxlint (ESLint-compatible rules; runs without the TypeScript JS API,
    # which TypeScript 7 no longer ships), knip (unused files), Prettier on
    # files a PR adds, and shellcheck on scripts/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: oxlint
        run: npx oxlint --format github

      - name: No unused frontend files (knip)
        run: npx knip --workspace frontend --production

      - name: Generated canister types match the declarations
        run: node --experimental-strip-types --no-warnings scripts/gen-declaration-types.mjs --check

      - name: Prettier on files this PR adds
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t added < <(git diff --name-only --diff-filter=A "$BASE_SHA"...HEAD \
            | grep -E '\.(ts|tsx|js|jsx|mjs|cjs|json)$' || true)
          if [ ${#added[@]} -eq 0 ]; then echo "No new files to check"; exit 0; fi
          npx prettier --check --ignore-unknown "${added[@]}"

      - name: shellcheck
        # Errors only for now; the existing scripts have warnings to clear first.
        run: |
          git ls-files '*.sh' | xargs shellcheck --severity=error

  test-dashboard:
    # Admin metrics dashboard: typecheck and build (its canister reads run
    # against real canisters in test-upgrade's dashboard-calls test).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: cd dashboard && npm ci

      - name: Typecheck
        run: cd dashboard && npm run type-check

      - name: Build
        run: cd dashboard && npm run build

  test-email:
    # Lead-form email relay (agents/email): Node's test runner, no test deps.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: agents/email/package-lock.json

      - name: Install dependencies
        run: cd agents/email && npm ci

      - name: Typecheck
        run: cd agents/email && npm run type-check

      - name: Unit tests
        run: cd agents/email && npm test

  test-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: cd mobile && npm ci

      - name: Typecheck and unit tests
        run: cd mobile && npm run ci

      # Metro bundles the app the way an EAS build does (no simulator or
      # Expo account needed), catching import/asset errors tsc and Jest miss.
      - name: Bundle smoke check (iOS)
        run: cd mobile && npx expo export --platform ios --output-dir "$RUNNER_TEMP/mobile-export"

  test-voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: agents/voice/package-lock.json

      - name: Install dependencies
        run: cd agents/voice && npm ci

      - name: Typecheck
        # Jest runs through babel-jest and wrangler bundles with esbuild;
        # neither checks types, so this is the only step that does.
        run: cd agents/voice && npx tsc --noEmit -p .

      - name: Unit tests with coverage
        run: cd agents/voice && npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: voice-coverage-report
          path: agents/voice/coverage/
          retention-days: 14

      - name: Integration tests
        # describeIfConfigured guards in the test files skip automatically
        # when keys are absent (empty string), so this step is always safe
        # to run — forks and PRs without secrets get 0 failures, 0 errors.
        env:
          STRIPE_SECRET_KEY:                 ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET:             ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_PRO_YEARLY:           ${{ secrets.STRIPE_PRICE_PRO_YEARLY }}
          STRIPE_PRICE_CONTRACTOR_PRO_MONTHLY: ${{ secrets.STRIPE_PRICE_CONTRACTOR_PRO_MONTHLY }}
          STRIPE_PRICE_CONTRACTOR_PRO_YEARLY:  ${{ secrets.STRIPE_PRICE_CONTRACTOR_PRO_YEARLY }}
        run: cd agents/voice && npm test -- stripe.integration stripe.elements.integration

      - name: Flag skipped Stripe tests on main
        # The tests skip without test-mode secrets; on main that should be
        # visible rather than a quiet green.
        if: github.ref == 'refs/heads/main'
        env:
          STRIPE_SECRET_KEY:       ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_PRO_YEARLY: ${{ secrets.STRIPE_PRICE_PRO_YEARLY }}
        run: |
          if [[ "$STRIPE_SECRET_KEY" != sk_test_* || -z "$STRIPE_PRICE_PRO_YEARLY" ]]; then
            echo "::warning title=Stripe integration tests skipped::Add the STRIPE_SECRET_KEY (sk_test_) and STRIPE_PRICE_PRO_YEARLY repository secrets so checkout, gifts and cancellation are tested against Stripe's test mode."
          fi

  test-e2e:
    runs-on: ubuntu-latest
    # No replica needed: tests run in mock mode (no .env → no canister IDs →
    # all service calls fall back to in-memory mocks). loginWithLocalIdentity()
    # now silently skips fetchRootKey when the replica is absent.
    needs: [test-frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm install

      - name: Install Playwright browsers
        # Must run AFTER npm install so the locally-pinned @playwright/test
        # version (not the latest npx fallback) determines which Chromium
        # revision is downloaded. Version mismatch causes "Executable doesn't
        # exist" for every test.
        run: cd frontend && npx @playwright/test install --with-deps chromium

      - name: Run E2E tests
        # Playwright's webServer config starts the Vite dev server and waits
        # for it — no need to start it manually. reuseExistingServer is set
        # to true in CI so Playwright owns the server lifecycle.
        run: npm run test:e2e

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  test-visual:
    name: test-visual
    runs-on: ubuntu-latest
    # Same mock-mode reasoning as test-e2e. Baselines are committed in
    # tests/e2e/__snapshots__/ — this job only compares, it never updates
    # them. On failure, test-visual-heal below regenerates and pushes new
    # baselines automatically; .github/workflows/visual-baseline-update.yml
    # remains available for a manual, on-demand refresh outside of CI.
    needs: [test-frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm install

      - name: Install Playwright browsers
        run: cd frontend && npx @playwright/test install --with-deps chromium

      - name: Run visual regression tests
        run: npm run test:visual

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff-report
          path: test-results/
          retention-days: 7

  # Auto-heals a test-visual failure caused by an intentional layout change:
  # regenerates screenshots with this runner's own Chromium build (the same
  # one test-visual compares against, so the result is trustworthy) and
  # pushes the update straight back to the branch. The commit below must
  # NOT carry a skip-CI marker in its message (GitHub matches that
  # substring literally, even inside prose explaining you didn't mean to
  # use it) — the push has to re-trigger a full CI run so a genuinely
  # green run exists for deploy-testnet.yml's workflow_run trigger to
  # fire on.
  #
  # Trade-off, accepted deliberately: this bakes in whatever the page now
  # renders as the new "correct" screenshot with no human review before it
  # lands. A real bug that changes the page (blank content, a thrown error,
  # a broken font) would get silently accepted here rather than failing
  # CI — test-e2e's content/accessibility assertions and test-frontend
  # remain the actual safety net for that class of bug, not this job.
  #
  # Split into two jobs on purpose (security audit CI-1): the job that runs
  # the branch's own code (npm install lifecycle scripts, Playwright config
  # and global setup) never sees CI_PUSH_TOKEN, and the job that holds the
  # token runs on a fresh runner, executes no repo code, and only copies
  # *.png files from the artifact into tests/e2e/__snapshots__/.
  test-visual-heal:
    name: test-visual-heal
    runs-on: ubuntu-latest
    needs: [test-visual]
    if: failure() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm install

      - name: Install Playwright browsers
        run: cd frontend && npx @playwright/test install --with-deps chromium

      - name: Regenerate visual baselines
        run: npm run test:visual:update

      - name: Upload regenerated baselines
        uses: actions/upload-artifact@v7
        with:
          name: visual-heal-baselines
          path: tests/e2e/__snapshots__/
          retention-days: 3

  test-visual-heal-push:
    name: test-visual-heal-push
    runs-on: ubuntu-latest
    needs: [test-visual-heal]
    # test-visual (an ancestor) failed by design, so the implicit success()
    # would skip this job; gate on the heal job's own result instead.
    if: ${{ !cancelled() && needs.test-visual-heal.result == 'success' }}
    permissions:
      contents: read   # the push itself authenticates with CI_PUSH_TOKEN
    steps:
      # main requires the motoko-compile-check status check even on direct
      # pushes, and the default GITHUB_TOKEN has no bypass for that rule —
      # only identities with admin/maintain-level bypass rights on the
      # branch protection rule can push straight to main. CI_PUSH_TOKEN is
      # a fine-grained PAT scoped to this repo (Contents: Read and write)
      # issued from such an account. It is never written to .git/config and
      # is only in the environment of the final push step.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}
          persist-credentials: false

      - name: Download regenerated baselines
        uses: actions/download-artifact@v8
        with:
          name: visual-heal-baselines
          path: ${{ runner.temp }}/visual-heal

      - name: Copy PNG baselines only
        env:
          SRC: ${{ runner.temp }}/visual-heal
        run: |
          set -euo pipefail
          DEST="tests/e2e/__snapshots__"
          cd "$SRC"
          # Only regular *.png files, relative paths, no traversal.
          find . -type f -name '*.png' -print0 | while IFS= read -r -d '' f; do
            rel="${f#./}"
            case "$rel" in *..*) echo "skipping suspicious path: $rel"; continue ;; esac
            mkdir -p "$GITHUB_WORKSPACE/$DEST/$(dirname "$rel")"
            cp -- "$rel" "$GITHUB_WORKSPACE/$DEST/$rel"
          done

      - name: Commit and push updated baselines
        env:
          CI_PUSH_TOKEN: ${{ secrets.CI_PUSH_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__snapshots__/
          if git diff --staged --quiet; then
            echo "No baseline diff produced — test-visual failed for a reason other than a layout change."
            echo "Leaving CI red; check the test-visual job's own failure output above."
            exit 1
          fi
          git commit -m "test(visual): auto-heal baseline after layout change"
          if [ -n "$HEAD_REF" ]; then TARGET="refs/heads/$HEAD_REF"; else TARGET="$GITHUB_REF"; fi
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${CI_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${TARGET}"
