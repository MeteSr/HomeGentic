name: Sync ICP skills

# Refreshes .claude/skills/ from skills.internetcomputer.org and opens a PR
# when DFINITY has published changes. The SessionStart hook in
# .claude/settings.json does the same at the start of each Claude session;
# this keeps the committed copy current for sessions that can't reach the host.

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync skills
        run: bash .claude/sync-ic-skills.sh

      - name: Open a PR if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A .claude/skills .claude/sync-ic-skills.sh
          if git diff --cached --quiet; then
            echo "Skills are up to date."
            exit 0
          fi
          branch="chore/sync-ic-skills"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git commit -m "chore: sync ICP skills from skills.internetcomputer.org"
          git push --force origin "$branch"
          if ! gh pr view "$branch" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr create --head "$branch" --base "${{ github.event.repository.default_branch }}" \
              --title "Sync ICP skills" \
              --body "Updates \`.claude/skills/\` to the latest skills published at https://skills.internetcomputer.org (generated by the Sync ICP skills workflow)."
          fi
