name: Deploy Mainnet

on:
  workflow_dispatch:

permissions:
  contents: read   # canister-ID commits push with CI_PUSH_TOKEN, not GITHUB_TOKEN

jobs:
  test:
    name: Pre-deploy test gate
    # Jobs in this workflow hold MAINNET_IDENTITY_PEM (controller of every
    # mainnet canister) and run the dispatched ref's own scripts, so only
    # main may be deployed — belt-and-braces on top of the `production`
    # environment's branch rule (security audit finding 5).
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write   # ci.yml's test-frontend declares it (PR coverage comment; skipped here)

  deploy:
    runs-on: ubuntu-latest
    environment: production
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      # persist-credentials: false keeps any token out of .git/config while
      # npm ci and deploy.sh run; CI_PUSH_TOKEN is only handed to the final
      # "Commit canister IDs" step (security audit CI-1).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install icp-cli
        # Pinned — this job also holds MAINNET_IDENTITY_PEM/MAINNET_WALLET_ID;
        # an unpinned `npm install -g` here would let a compromised package
        # release run with mainnet wallet/identity secrets in scope.
        run: npm install -g @icp-sdk/icp-cli@1.7.0
      - name: Install mops
        run: npm install -g ic-mops@3.5.1
      - name: Install Node dependencies
        run: npm ci

      - name: Install dfx
        run: |
          curl -fsSL -o /tmp/dfx.tar.gz "https://github.com/dfinity/sdk/releases/download/0.24.3/dfx-x86_64-unknown-linux-gnu.tar.gz"
          echo "d8701438d05d9da0da0c90ab9342ac9ba6b0371ae9f5d1a943e94600fd674498  /tmp/dfx.tar.gz" | sha256sum -c -
          tar -xzf /tmp/dfx.tar.gz
          DFX_BIN=$(find . -name "dfx*" -type f -perm /111 | head -1)
          sudo install -m 755 "$DFX_BIN" /usr/local/bin/dfx
          dfx --version

      - name: Wallet cycles pre-flight
        run: bash scripts/check-wallet-balance.sh
        env:
          DFX_IDENTITY_PEM: ${{ secrets.MAINNET_IDENTITY_PEM }}
          DFX_WALLET_ID: ${{ secrets.MAINNET_WALLET_ID }}
          DFX_NETWORK: ic
          ICP_ENV: ic

      - name: Deploy to mainnet
        # Environment is a positional arg ($1). Must be: bash scripts/deploy.sh ic
        run: bash scripts/deploy.sh ic
        env:
          DFX_IDENTITY_PEM: ${{ secrets.MAINNET_IDENTITY_PEM }}
          DFX_WALLET_ID: ${{ secrets.MAINNET_WALLET_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOICE_AGENT_API_KEY: ${{ secrets.VOICE_AGENT_API_KEY }}
          VITE_VOICE_AGENT_API_KEY: ${{ secrets.VITE_VOICE_AGENT_API_KEY }}
          VITE_VOICE_AGENT_URL: ${{ secrets.VITE_VOICE_AGENT_URL }}
          BACKUP_CONTROLLER_PRINCIPAL: ${{ secrets.BACKUP_CONTROLLER_PRINCIPAL }}
          # Optional grants for the off-chain services (see "One-time canister
          # configuration" in docs/DEPLOYMENT.md). Principals aren't secret, so
          # they can be environment variables; secrets work too.
          NOTIFIER_PRINCIPAL: ${{ vars.NOTIFIER_PRINCIPAL || secrets.NOTIFIER_PRINCIPAL }}
          VOICE_WORKER_PRINCIPAL: ${{ vars.VOICE_WORKER_PRINCIPAL || secrets.VOICE_WORKER_PRINCIPAL }}
          # Unset, sensor accepts self-asserted device IDs for every platform.
          IOT_GATEWAY_PRINCIPAL: ${{ vars.IOT_GATEWAY_PRINCIPAL || secrets.IOT_GATEWAY_PRINCIPAL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_ADDRESS: ${{ secrets.RESEND_FROM_ADDRESS }}
          OPEN_PERMIT_API_KEY: ${{ secrets.OPEN_PERMIT_API_KEY }}
          ATTOM_API_KEY: ${{ secrets.ATTOM_API_KEY }}
          # deploy.sh's pre-flight refuses to deploy without these two.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          # Optional: the notification relay's URL. Unset hides the browser
          # push toggle and leaves the relay out of the CSP.
          VITE_NOTIFICATIONS_URL: ${{ secrets.VITE_NOTIFICATIONS_URL }}
          # Optional: the IoT gateway's public URL, for sensor account sign-in.
          # Unset hides the "Connect account" button.
          VITE_IOT_GATEWAY_URL: ${{ vars.VITE_IOT_GATEWAY_URL || secrets.VITE_IOT_GATEWAY_URL }}
          # Optional: domain of the forwarded-invoice addresses (h-<token>@domain);
          # must match the Worker's INBOX_DOMAIN. Unset hides the address.
          VITE_INBOX_DOMAIN: ${{ vars.VITE_INBOX_DOMAIN }}
          # Optional: universal links for the mobile app (/.well-known files).
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}

      - name: Commit canister IDs
        # Must run even when the deploy step above fails partway through:
        # canister creation is real and paid for the moment it happens,
        # regardless of whether a later step fails — losing these IDs here
        # means the next run can't tell those canisters already exist and
        # will try to create them again, wasting cycles on duplicates or
        # failing outright. Same fix as deploy-testnet.yml.
        # main requires the motoko-compile-check status check even on direct
        # pushes, and the default GITHUB_TOKEN has no bypass for that rule.
        # CI_PUSH_TOKEN is a fine-grained PAT scoped to this repo (Contents:
        # Read and write) issued from an account that does have that bypass.
        # It is only in this step's environment, never in .git/config.
        if: always()
        env:
          CI_PUSH_TOKEN: ${{ secrets.CI_PUSH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add canister_ids.json .icp/data/mappings/
          if git diff --staged --quiet; then
            echo "canister IDs unchanged, nothing to commit"
          else
            git commit -m "ops: update canister IDs after mainnet deploy [skip ci]"
            # A lost push means the next run can't see these canisters and
            # tries to create them again, so it fails the job instead of warning.
            git -c core.hooksPath=/dev/null push \
              "https://x-access-token:${CI_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "HEAD:${GITHUB_REF}" || {
                echo "::error::Push blocked — commit canister_ids.json by hand from this log before the next deploy"
                git diff HEAD~1 -- canister_ids.json
                exit 1
              }
          fi

      - name: Tag the release
        # Rollback means redeploying a known commit (docs/UPGRADE_RUNBOOK.md),
        # so every successful mainnet deploy gets a tag on the commit it ran.
        if: success()
        env:
          CI_PUSH_TOKEN: ${{ secrets.CI_PUSH_TOKEN }}
        run: |
          TAG="mainnet-$(date -u +%Y%m%d-%H%M%S)"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Mainnet deploy, run $GITHUB_RUN_ID"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${CI_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG"
          echo "Tagged $GITHUB_SHA as $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Post-deploy cycle health gate
        # Fail the deploy if any canister is within 30 days of its freezing
        # threshold, or its balance can't be read (scripts/lib/cycles.sh).
        run: bash scripts/check-cycle-health.sh
        env:
          ICP_ENV: ic

  deploy-voice-worker:
    runs-on: ubuntu-latest
    environment: production
    needs: deploy
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22  # wrangler 4 requires Node >= 22
          cache: npm
          cache-dependency-path: agents/voice/package-lock.json
      - name: Install voice agent dependencies
        working-directory: agents/voice
        run: npm ci
      - name: Deploy voice agent to Cloudflare Workers
        working-directory: agents/voice
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-email-worker:
    runs-on: ubuntu-latest
    environment: production
    # Previously had no `needs:` and deployed before the test gate ran.
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22  # wrangler 4 requires Node >= 22
          cache: npm
          cache-dependency-path: agents/email/package-lock.json
      - name: Install email relay dependencies
        working-directory: agents/email
        run: npm ci
      - name: Deploy email relay to Cloudflare Workers
        working-directory: agents/email
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
