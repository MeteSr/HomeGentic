name: Deploy Testnet

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      start_frontend_canister_first:
        description: 'Start frontend canister first (recovers from a stopped-canister IC0508 deploy failure)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read   # canister-ID commits push with CI_PUSH_TOKEN, not GITHUB_TOKEN

# One testnet deploy at a time: two merges close together would otherwise upgrade
# the same canisters and both push canister IDs to main. Queue, don't cancel,
# so a deploy is never killed halfway through an upgrade.
concurrency:
  group: deploy-testnet
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: testnet
    # Manual dispatch only from main (the job holds the testnet
    # deploy PEM and runs the ref's own scripts/deploy.sh). workflow_run only
    # for a successful CI *push* run in this repo: the branches filter above
    # matches head_branch, so without the event/repo check a fork PR from a
    # branch named main would trigger a deploy.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      # persist-credentials: false keeps any token out of .git/config while
      # npm ci and deploy.sh run; CI_PUSH_TOKEN is only handed to the final
      # "Commit canister IDs" step (security audit CI-1).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Install icp-cli
        # Pinned to the same version as deploy-mainnet.yml — this job later
        # holds DFX_IDENTITY_PEM, so an unpinned global install would let a
        # compromised release run with the deploy identity in scope.
        run: npm install -g @icp-sdk/icp-cli@1.7.0

      - name: Cache mops packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/mops
          key: mops-${{ runner.os }}-${{ hashFiles('mops.toml') }}

      - name: Install mops
        run: npm install -g ic-mops@3.5.1

      - name: Install dfx
        run: |
          curl -fsSL -o /tmp/dfx.tar.gz "https://github.com/dfinity/sdk/releases/download/0.24.3/dfx-x86_64-unknown-linux-gnu.tar.gz"
          echo "d8701438d05d9da0da0c90ab9342ac9ba6b0371ae9f5d1a943e94600fd674498  /tmp/dfx.tar.gz" | sha256sum -c -
          tar -xzf /tmp/dfx.tar.gz
          DFX_BIN=$(find . -name "dfx*" -type f -perm /111 | head -1)
          sudo install -m 755 "$DFX_BIN" /usr/local/bin/dfx
          dfx --version

      - name: Wallet cycles pre-flight
        run: bash scripts/check-wallet-balance.sh
        env:
          DFX_IDENTITY_PEM: ${{ secrets.DFX_IDENTITY_PEM }}
          DFX_WALLET_ID: ${{ secrets.DFX_WALLET_ID }}
          DFX_NETWORK: ic
          ICP_ENV: testnet

      - name: Deploy to testnet
        run: bash scripts/deploy.sh testnet
        env:
          DFX_IDENTITY_PEM: ${{ secrets.DFX_IDENTITY_PEM }}
          DFX_WALLET_ID: ${{ secrets.DFX_WALLET_ID }}
          BACKUP_CONTROLLER_PRINCIPAL: ${{ secrets.BACKUP_CONTROLLER_PRINCIPAL }}
          # Optional grants for the off-chain services (see "One-time canister
          # configuration" in docs/DEPLOYMENT.md). Principals aren't secret, so
          # they can be environment variables; secrets work too.
          NOTIFIER_PRINCIPAL: ${{ vars.NOTIFIER_PRINCIPAL || secrets.NOTIFIER_PRINCIPAL }}
          VOICE_WORKER_PRINCIPAL: ${{ vars.VOICE_WORKER_PRINCIPAL || secrets.VOICE_WORKER_PRINCIPAL }}
          # Unset, sensor accepts self-asserted device IDs for every platform.
          IOT_GATEWAY_PRINCIPAL: ${{ vars.IOT_GATEWAY_PRINCIPAL || secrets.IOT_GATEWAY_PRINCIPAL }}
          START_FRONTEND_CANISTER_FIRST: ${{ inputs.start_frontend_canister_first || 'false' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOICE_AGENT_API_KEY: ${{ secrets.VOICE_AGENT_API_KEY }}
          VITE_VOICE_AGENT_API_KEY: ${{ secrets.VITE_VOICE_AGENT_API_KEY }}
          # Voice/AI Worker URL baked into the frontend bundle and its CSP
          # connect-src. Without it the build falls back to localhost:8787.
          VITE_VOICE_AGENT_URL: ${{ secrets.VITE_VOICE_AGENT_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          # Optional: the testnet notification relay's URL (see DEPLOYMENT.md).
          VITE_NOTIFICATIONS_URL: ${{ secrets.VITE_NOTIFICATIONS_URL }}
          # Optional: the IoT gateway's public URL, for sensor account sign-in.
          # Unset hides the "Connect account" button.
          VITE_IOT_GATEWAY_URL: ${{ vars.VITE_IOT_GATEWAY_URL || secrets.VITE_IOT_GATEWAY_URL }}
          # Optional: domain of the forwarded-invoice addresses (h-<token>@domain);
          # must match the Worker's INBOX_DOMAIN. Unset hides the address.
          VITE_INBOX_DOMAIN: ${{ vars.VITE_INBOX_DOMAIN }}
          # Optional: universal links for the mobile app (/.well-known files).
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}

      - name: Commit canister IDs
        # Must run even when the deploy step above fails partway through:
        # canister creation is real and paid for the moment it happens,
        # regardless of whether a later step (e.g. the frontend build)
        # fails — losing these IDs here means the next run can't tell
        # those canisters already exist and will try to create them
        # again, wasting cycles on duplicates or failing outright.
        # main requires the motoko-compile-check status check even on direct
        # pushes, and the default GITHUB_TOKEN has no bypass for that rule.
        # CI_PUSH_TOKEN is a fine-grained PAT scoped to this repo (Contents:
        # Read and write) issued from an account that does have that bypass.
        # It is only in this step's environment, never in .git/config.
        if: always()
        env:
          CI_PUSH_TOKEN: ${{ secrets.CI_PUSH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add canister_ids.json .icp/data/mappings/
          if git diff --staged --quiet; then
            echo "canister IDs unchanged, nothing to commit"
          else
            git commit -m "ops: update canister IDs after testnet deploy [skip ci]"
            git -c core.hooksPath=/dev/null push \
              "https://x-access-token:${CI_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "HEAD:${GITHUB_REF}" || {
                echo "::error::Push blocked — commit canister_ids.json by hand from this log before the next deploy"
                git diff HEAD~1 -- canister_ids.json
                exit 1
              }
          fi

      - name: Post-deploy smoke test
        # Every canister running, the deployed code answering, the frontend
        # serving the app (scripts/smoke-deployed.sh).
        run: bash scripts/smoke-deployed.sh
        env:
          ICP_ENV: testnet

  deploy-voice-worker:
    runs-on: ubuntu-latest
    environment: testnet
    # After the canisters, so the Worker never calls a method that isn't
    # deployed yet (same order as deploy-mainnet.yml).
    needs: deploy
    # Manual dispatch only from main (the job holds the testnet
    # deploy PEM and runs the ref's own scripts/deploy.sh). workflow_run only
    # for a successful CI *push* run in this repo: the branches filter above
    # matches head_branch, so without the event/repo check a fork PR from a
    # branch named main would trigger a deploy.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'  # wrangler 4 requires Node >= 22
          cache: npm
          cache-dependency-path: agents/voice/package-lock.json
      - name: Install voice agent dependencies
        working-directory: agents/voice
        run: npm ci
      - name: Deploy voice agent to Cloudflare Workers (testnet)
        # Separate Worker ([env.testnet] in wrangler.toml) with its own
        # secrets, KV namespace and FRONTEND_ORIGIN. The testnet frontend
        # reaches it via the VITE_VOICE_AGENT_URL secret.
        working-directory: agents/voice
        run: npx wrangler deploy --env testnet
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Post-deploy Worker health
        # /health is 503 when a secret or canister ID the Worker needs is missing.
        run: ONLY=worker bash scripts/smoke-deployed.sh
        env:
          VOICE_AGENT_URL: ${{ secrets.VITE_VOICE_AGENT_URL }}

  deploy-email-worker:
    runs-on: ubuntu-latest
    environment: testnet
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'  # wrangler 4 requires Node >= 22
          cache: npm
          cache-dependency-path: agents/email/package-lock.json
      - name: Install email relay dependencies
        working-directory: agents/email
        run: npm ci
      - name: Deploy email relay to Cloudflare Workers (testnet)
        # --env testnet deploys homegentic-email-relay-testnet. Without it this
        # job overwrote the production relay on every merge.
        working-directory: agents/email
        run: npx wrangler deploy --env testnet
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
