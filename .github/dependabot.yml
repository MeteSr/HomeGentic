version: 2
updates:
  # Root workspace: frontend app, Playwright and a11y tooling
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    # jsdom 30 stops computing rem lengths, which breaks the toHaveStyle
    # assertions; stay on 29 until the tests stop depending on that.
    ignore:
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
    groups:
      dev-tooling:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      runtime:
        dependency-type: "production"
        update-types: ["minor", "patch"]

  # Ops scripts run by the watchdog and backup workflows (controller identity in scope)
  - package-ecosystem: "npm"
    directory: "/scripts/ops"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ops"

  - package-ecosystem: "npm"
    directory: "/agents/voice"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "voice-agent"
    groups:
      dev-tooling:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      runtime:
        dependency-type: "production"
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/agents/email"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "email-relay"
    groups:
      dev-tooling:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      runtime:
        dependency-type: "production"
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/agents/notifications"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "notifications"
    # Runs on Node 22: keep @types/node on the 22 line.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-tooling:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      runtime:
        dependency-type: "production"
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/agents/iot-gateway"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "iot-gateway"
    # Runs on Node 22: keep @types/node on the 22 line.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-tooling:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      runtime:
        dependency-type: "production"
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "dashboard"
    groups:
      dev-tooling:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      runtime:
        dependency-type: "production"
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "mobile"
    # Expo SDK packages must move together with `npx expo install --fix`;
    # Dependabot would bump them one at a time past the installed SDK.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "jest-expo"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "react"
      - dependency-name: "react-test-renderer"
      - dependency-name: "@types/react"
      # babel-preset-expo pins ^7 of its Babel plugins
      - dependency-name: "@babel/plugin-transform-class-static-block"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-tooling:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      runtime:
        dependency-type: "production"
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/tests/upgrade"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "tests"
    # PocketIC 0.24+ (needed for @icp-sdk/core 6) changes cycle accounting
    # in the scaling test; move both together once that test is reworked.
    ignore:
      - dependency-name: "@dfinity/pic"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@icp-sdk/core"
        update-types: ["version-update:semver-major"]
    groups:
      dev-tooling:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      runtime:
        dependency-type: "production"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
